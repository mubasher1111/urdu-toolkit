# Publishes to npm when a version tag (e.g. v1.2.0) is pushed.
# Uses npm trusted publishing (OIDC): no npm token or 2FA prompt needed.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # required for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - run: npm publish --access public
